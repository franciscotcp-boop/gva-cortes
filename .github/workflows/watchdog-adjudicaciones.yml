name: Vigilar adjudicaciones
run-name: Vigilar adjudicaciones (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/watchdog-adjudicaciones.yml'
      - '.github/workflows/update-adjudicaciones.yml'
      - '.github/scripts/watchdog-adjudicaciones*'
      - 'scripts/automation_schedule.py'
      - 'tests/test_automation_schedule.py'
  workflow_run:
    workflows: ["Actualizar adjudicaciones"]
    types: [completed]
    branches: [main]
  schedule:
    # Pulso UTC sencillo, tambien de madrugada si GitHub entrega eventos tarde.
    # El script conserva el calendario de Madrid y solo recupera fuentes pendientes.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Comprobar sin cancelar ni relanzar nada"
        required: false
        type: boolean
        default: true
      test_alert:
        description: "Enviar una alerta de prueba sin intervenir"
        required: false
        type: boolean
        default: false

# El vigilante puede leer el JSON, administrar ejecuciones y avisar mediante
# incidencias. No tiene permiso para modificar ningun archivo del repositorio.
permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: vigilar-adjudicaciones
  cancel-in-progress: false

jobs:
  watchdog:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - name: Descargar solamente el codigo del vigilante
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Comprobar vigilante
        run: node --test .github/scripts/watchdog-adjudicaciones.test.js

      - name: Revisar workflow principal y generated_at
        id: watchdog
        uses: actions/github-script@v8
        env:
          PRIMARY_WORKFLOW: update-adjudicaciones.yml
          DATA_PATH: data/adjudicaciones.json
          # No cancelar un procesamiento valido antes del timeout de 35 min.
          RUN_STALE_MINUTES: "40"
          DATA_MAX_AGE_MINUTES: "1440"
          FAILURE_THRESHOLD: "1"
          RECOVERY_WAIT_MINUTES: "15"
          RECOVERY_COOLDOWN_MINUTES: "60"
          SCHEDULE_GRACE_MINUTES: "15"
          SCHEDULE_LOOKBACK_MINUTES: "1440"
          DRY_RUN: ${{ inputs.dry_run || false }}
          TEST_ALERT: ${{ inputs.test_alert || false }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 2
          retry-exempt-status-codes: 400,401,403,404,409,422
          script: |
            const runWatchdog = require("./.github/scripts/watchdog-adjudicaciones.js");
            await runWatchdog({ github, context, core });
