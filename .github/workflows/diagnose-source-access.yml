name: Diagnosticar acceso a Conselleria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probar acceso sin publicar ni modificar datos
        run: python scripts/diagnose_source_access.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-access-${{ matrix.runner }}
          path: source-access-report.json
          retention-days: 7
